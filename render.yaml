# Render Blueprint for ClueCrew (free tier compatible)
# Docs: docs/DEPLOYMENT.md
#
# One web service runs the API, the WebSocket server and serves the
# built client from the same origin (recommended setup).
services:
  - type: web
    name: cluecrew
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the runtime that this project is verified against (Node 22 LTS).
      - key: NODE_VERSION
        value: '22'
      # 64-hex secret used to encrypt OAuth tokens at rest.
      # Render generates a strong value automatically.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # URL configuration is optional: the server automatically uses Render's
      # RENDER_EXTERNAL_URL (the assigned https://<service>.onrender.com URL),
      # so no manual values are needed. Set BACKEND_URL / FRONTEND_URL /
      # ALLOWED_ORIGINS in the dashboard only for a custom domain or a split
      # frontend/backend setup.
      #
      # SQLite on the free tier is ephemeral (lost on restart/redeploy).
      # Rooms are ephemeral by design; see docs/DEPLOYMENT.md for options.
      - key: DATABASE_PATH
        value: ./data/cluecrew.sqlite
      - key: ALLOW_MOCK_PROVIDER
        value: 'true'
      # Optional TikTok integration: add TIKTOK_CLIENT_KEY /
      # TIKTOK_CLIENT_SECRET in the dashboard after creating a TikTok developer
      # app. The callback URL to register is always:
      #   https://<your-service>.onrender.com/api/auth/tiktok/callback
      # Only enable Data Portability after TikTok approves it:
      - key: TIKTOK_DATAPORTABILITY_ENABLED
        value: 'false'
      - key: TIKTOK_DATAPORTABILITY_SCOPE
        value: portability.all.ongoing
