# Render Blueprint for ClueCrew (free tier compatible)
# Docs: docs/DEPLOYMENT.md
#
# One web service runs the API, the WebSocket server and serves the
# built client from the same origin (recommended setup).
services:
  - type: web
    name: cluecrew
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the runtime that this project is verified against (Node 22 LTS).
      - key: NODE_VERSION
        value: '22'
      # 64-hex secret used to encrypt OAuth tokens at rest.
      # Render generates a strong value automatically.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # URL configuration is optional: when these stay empty, the server uses
      # Render's RENDER_EXTERNAL_URL (the assigned https://<service>.onrender.com
      # URL) automatically, so no copy/paste is needed. Set them explicitly only
      # for a custom domain or a split frontend/backend setup.
      - key: BACKEND_URL
        value: ''
      - key: FRONTEND_URL
        value: ''
      - key: ALLOWED_ORIGINS
        value: ''
      # SQLite on the free tier is ephemeral (lost on restart/redeploy).
      # Rooms are ephemeral by design; see docs/DEPLOYMENT.md for durability options.
      - key: DATABASE_PATH
        value: ./data/cluecrew.sqlite
      - key: ALLOW_MOCK_PROVIDER
        value: 'true'
      # Optional TikTok integration: add these in the dashboard after creating a
      # TikTok developer app. The callback URL to register is always:
      #   https://<your-service>.onrender.com/api/auth/tiktok/callback
      - key: TIKTOK_CLIENT_KEY
        value: ''
      - key: TIKTOK_CLIENT_SECRET
        value: ''
      # Only enable after TikTok approves Data Portability (see docs/TIKTOK-DATA-PORTABILITY.md)
      - key: TIKTOK_DATAPORTABILITY_ENABLED
        value: 'false'
      - key: TIKTOK_DATAPORTABILITY_SCOPE
        value: portability.all.ongoing
